# Tiny Tapeout project information
project:
  title:        "AES_128"      # Project title
  author:       "CHYH"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Encrypts message using AES-128"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_AES128"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_AES128.v"
    - "subword.v"
    - "subbyte.v"
    - "shiftrows.v"
    - "sbox.v"
    - "rotword.v"
    - "rcon.v"
    - "mixcolumns_one_column.v"
    - "main.v"
    - "addroundkey.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui_in[0]: "BIT[0]"
  ui_in[1]: "BIT[1]"
  ui_in[2]: "BIT[2]"
  ui_in[3]: "BIT[3]"
  ui_in[4]: "BIT[4]"
  ui_in[5]: "BIT[5]"
  ui_in[6]: "BIT[6]"
  ui_in[7]: "BIT[7]"

  # Outputs
  uo_out[0]: "BIT[0]"
  uo_out[1]: "BIT[1]"
  uo_out[2]: "BIT[2]"
  uo_out[3]: "BIT[3]"
  uo_out[4]: "BIT[4]"
  uo_out[5]: "BIT[5]"
  uo_out[6]: "BIT[6]"
  uo_out[7]: "BIT[7]"

  # Bidirectional pins
  uio_in[0]: "BYTE_INDEX[0]"
  uio_in[1]: "BYTE_INDEX[1]"
  uio_in[2]: "BYTE_INDEX[2]"
  uio_in[3]: "BYTE_INDEX[3]"
  uio_in[4]: "BYTE_INDEX[4]"
  uio_in[5]: "WRITE_ENABLE"
  uio_in[6]: "START"
  uio_in[7]: "OUTPUT_SELECT"

  uio_out[0]: "BUSY"
  uio_out[1]: "DONE"
  


# Do not change!
yaml_version: 6
